detection:
  backend: yolo_seg
  model_path: data/models/pothole_seg.pt
  fallback_model: yolov8n-seg.pt
  confidence_threshold: 0.35
  iou_threshold: 0.45
  inference_size: 640
  class_names:
    - pothole
  device: auto

postprocess:
  min_area_pixels: 80
  min_mask_area_ratio: 0.3
  morph_kernel_size: 3
