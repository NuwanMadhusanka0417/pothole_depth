# Default pipeline configuration
video:
  frame_stride: 1
  max_frames: null
  start_frame: 0
  duration_seconds: null

paths:
  input_dir: data/input
  output_dir: data/output
  events_dir: data/events
  cache_dir: data/output/cache
  models_dir: data/models
  calibration_dir: data/calibration

logging:
  level: INFO
  structured: true

pipeline:
  mode: detection  # detection | tracking | geometry | full
  debug: false
  force_recompute: false

# Include sub-configs (merged at load time)
includes:
  - roi.yaml
  - camera.yaml
  - detection.yaml
  - depth.yaml
  - reconstruction.yaml

zones:
  detection_start_y: 0.64
  tracking_start_y: 0.69
  depth_start_y: 0.74
  depth_end_y: 0.88

quality:
  min_sharpness: 50.0
  max_blur_score: 0.85
  min_brightness: 30.0
  max_brightness: 240.0
  min_contrast: 15.0
  max_saturation_clip_ratio: 0.15
  min_pothole_pixels: 100
  min_visible_ratio: 0.5
  max_frames_per_track: 30
  min_frames_for_depth: 5

tracking:
  max_age: 30
  min_track_frames: 3
  iou_threshold: 0.2
  mask_iou_threshold: 0.15
  centroid_max_distance_ratio: 0.15
  min_frames_ready_for_depth: 10

road_surface:
  model: auto  # plane | quadratic | auto
  ring_width_pixels: 40
  ransac_threshold: 0.02
  min_road_points: 200

measurement:
  deepest_percentile: 98.0
  robust_deepest_fraction: 0.03
  min_pothole_pixels: 150

confidence:
  metric_accept: 0.85
  approximate_accept: 0.65
  reject_below: 0.65

dynamic_objects:
  enabled: true
  classes: [2, 3, 5, 6, 7]  # COCO: car, motorcycle, bus, train, truck
  confidence: 0.35

output:
  annotated_video: true
  save_detections_json: true
  save_roi_debug: true
  save_event_images: true
