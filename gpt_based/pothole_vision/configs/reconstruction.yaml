reconstruction:
  backend: opencv_triangulation  # opencv_triangulation | colmap | vggt
  min_feature_matches: 30
  min_inlier_ratio: 0.4
  min_parallax_deg: 0.5
  max_reprojection_error: 2.0
  feature_detector: orb  # orb | sift | superpoint
  max_features: 2000
  ransac_threshold: 1.0

colmap:
  enabled: false
  install_note: Install COLMAP separately and set reconstruction.backend=colmap

vggt:
  enabled: false
  install_note: >
    Optional VGGT adapter. See README for installation.
    Set reconstruction.backend=vggt when available.

bundle_adjustment:
  enabled: false
